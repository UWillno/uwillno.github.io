      本次更新新增图片格式转换功能，主要适配 WebAssembly 环境。QImage 支持读取多种格式但仅部分可写入，WebP 因体积小巧成为首选，尽管编解码较耗 CPU。当前仅测试 WebP、JPEG 和 PNG 的质量参数设置，批量转换建议改用 Pillow 脚本。上传资源仍采用 JPEG 二分法压缩，未启用此功能。下载任务已加入后台队列以防页面关闭丢失，路由地址为 imgfmt。

    </p>

  <div id="qt-container" style="position:absolute;inset:0"></div>

  <script>
    window.showOpenFilePicker = undefined;

    function app() {
      return {
        status: '验证运行环境 · 准备加载',
        sizeText: '',
        ready: false,
        error: false,
        errorMsg: '',

        
        zstSize: "26259530",

        mirrors: [
          ['GitHub', 'https://github.uwillno.com'],
          ['Vercel', 'https://vercel.uwillno.com'],
          ['Cloudflare', 'https://uwillno.com'],
          ['EdgeOne', 'https://edgeone.uwillno.com'],
          ['Netlify', 'https://netlify.uwillno.com'],
          ['Azure', 'https://azure.uwillno.com'],
          ['GitLab', 'https://gitlab.uwillno.com'],
          ['Render', 'https://render.uwillno.com']
        ],


        init() {
          window.app = this;
          boot();
        },


        updateProgress(d) {
          if (!d.useByteProgress || d.totalBytesExpected <= 0) return;

          const loaded = Math.max(0, d.bytesLoaded);
          const total = d.totalBytesExpected;

          this.sizeText =
            `${(loaded).toLocaleString()} / ` +
            `${(total).toLocaleString()} B`;

          this.status = loaded >= total
            ? '下载完成 · 正在解压'
            : '正在下载 Blog 资源';
        },

        onWasmReady(url) {
          this.sizeText = '';
          this.status = 'WASM 完成 · 启动 Qt';

          startQtApplication(url);
        },

        onAppReady() {
          this.ready = true;
          const qt = document.getElementById('qt-container');
          qt.style.display = 'block';

          stopWorker();
        },

        onError(msg) {
          if (this.ready || this.error) return;

          this.error = true;
          this.status = '加载失败';
          this.errorMsg =
            '加载失败: ' + (msg?.message || msg || '未知错误');

          stopWorker();
        },

        isCurrent(url) {
          try {
            return location.hostname === new URL(url).hostname;
          } catch {
            return location.hostname.includes(
              url.replace('https://', '').split('.')[0]
            );
          }
        }
      };
    }


    

    async function waitForSWController() {
      if (!navigator.serviceWorker) return;
      if (navigator.serviceWorker.controller) return;

      await new Promise(resolve => {
        const timer = setTimeout(resolve, 2000);

        navigator.serviceWorker.addEventListener(
          'controllerchange',
          () => {
            clearTimeout(timer);
            resolve();
          },
          { once: true }
        );
      });
    }


    function supportsJSPI() {
      return typeof WebAssembly.Suspending === 'function' &&
        typeof WebAssembly.promising === 'function';
    }


    function ensureCOIReady() {
      if (
        crossOriginIsolated &&
        typeof SharedArrayBuffer !== 'undefined'
      ) {
        sessionStorage.removeItem('coi_reload');
        return true;
      }

      if (!sessionStorage.getItem('coi_reload')) {
        sessionStorage.setItem('coi_reload', '1');
        window.stop();
        location.reload();
        return false;
      }

      throw new Error('SharedArrayBuffer 不可用');
    }


    function isWasm64Supported() {
      return WebAssembly.validate(new Uint8Array([
        0x00, 0x61, 0x73, 0x6d, 
        0x01, 0x00, 0x00, 0x00, 

        
        0x05,
        0x03,
        0x01,
        0x04, 
        0x01  
      ]));
    }


    

    let worker = null;
    let workerStarted = false;


    function stopWorker() {
      if (worker) {
        worker.terminate();
        worker = null;
      }

      workerStarted = false;
    }


    function createWorker(zstSize) {
      const fzstdUrl = new URL(
        'fzstd.js',
        location.origin
      ).href;

      const code = `
    importScripts('${fzstdUrl}');

    const totalSize = ${zstSize};

    const wasmParts = [
      'blog01.wasm',
      'blog02.wasm',
      'blog03.wasm',
      'blog04.wasm',
      'blog05.wasm',
      'blog06.wasm',
      'blog07.wasm',
      'blog08.wasm',
      'blog09.wasm',
      'blog10.wasm'
    ];

    
    const MAX_ATTEMPTS = 5;
    const BASE_DELAY = 1000;
    const MAX_DELAY = 5000;

    
    const partProgress = new Array(wasmParts.length).fill(0);

    function reportProgress() {
      const bytesLoaded = partProgress.reduce(
        (sum, size) => sum + size,
        0
      );

      self.postMessage({
        type: 'progress',
        bytesLoaded,
        totalBytesExpected: totalSize,
        useByteProgress: true
      });
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function downloadPart(index) {
      const partName = wasmParts[index];
      const url = new URL(partName, location.origin).href;

      for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
        let reader = null;

        try {
          
          partProgress[index] = 0;
          reportProgress();

          const response = await fetch(url, {
            cache: 'no-store'
          });

          if (!response.ok) {
            throw new Error(
              partName + ' HTTP ' + response.status
            );
          }

          const chunks = [];
          let loaded = 0;

          if (response.body) {
            reader = response.body.getReader();

            while (true) {
              const { done, value } = await reader.read();

              if (done) break;

              chunks.push(value);
              loaded += value.byteLength;

              partProgress[index] = loaded;
              reportProgress();
            }
          } else {
            const buffer = new Uint8Array(
              await response.arrayBuffer()
            );

            chunks.push(buffer);
            loaded = buffer.byteLength;

            partProgress[index] = loaded;
            reportProgress();
          }

          
          const result = new Uint8Array(loaded);
          let offset = 0;

          for (const chunk of chunks) {
            result.set(chunk, offset);
            offset += chunk.byteLength;
          }

          return result;

        } catch (err) {
          if (reader) {
            try {
              await reader.cancel();
            } catch (_) {}
          }

          
          partProgress[index] = 0;
          reportProgress();

          if (attempt >= MAX_ATTEMPTS) {
            throw new Error(
              partName + ' 下载失败，已尝试 ' +
              MAX_ATTEMPTS + ' 次：' +
              (err.message || String(err))
            );
          }

          const delay = Math.min(
            BASE_DELAY * Math.pow(2, attempt - 1),
            MAX_DELAY
          );

          self.postMessage({
            type: 'status',
            text: partName + ' 下载失败，' +
              (delay / 1000) +
              ' 秒后重试 (' +
              attempt + '/' +
              (MAX_ATTEMPTS - 1) + ')'
          });

          await sleep(delay);
        }
      }
    }

    async function loadAndMergeWasm() {
      self.postMessage({
        type: 'status',
        text: '正在下载 Blog 资源'
      });

      
      
      const buffers = await Promise.all(
        wasmParts.map((_, index) => downloadPart(index))
      );

      const actualSize = buffers.reduce(
        (sum, buffer) => sum + buffer.byteLength,
        0
      );

      if (actualSize !== totalSize) {
        throw new Error(
          '合并大小异常：' +
          actualSize + ' / ' + totalSize
        );
      }

      self.postMessage({
        type: 'status',
        text: '下载完成，正在合并并解压 zstd'
      });

      
      const compressed = new Uint8Array(actualSize);
      let offset = 0;

      for (const buffer of buffers) {
        compressed.set(buffer, offset);
        offset += buffer.byteLength;
      }

      
      const decompressed = self.fzstd.decompress(compressed);

      const blob = new Blob(
        [decompressed],
        { type: 'application/wasm' }
      );

      const wasmUrl = URL.createObjectURL(blob);

      self.postMessage({
        type: 'wasmReady',
        wasmUrl
      });
    }

    let started = false;

    self.onmessage = async function(e) {
      if (e.data?.type !== 'start' || started) return;
      started = true;

      try {
        await loadAndMergeWasm();
      } catch (err) {
        self.postMessage({
          type: 'error',
          error: '下载或解压失败：' +
            (err.message || String(err))
        });
      }
    };
  `;

      const workerUrl = URL.createObjectURL(
        new Blob([code], {
          type: 'application/javascript'
        })
      );

      try {
        return new Worker(workerUrl);
      } finally {
        URL.revokeObjectURL(workerUrl);
      }
    }


    

    function startLoading(zstSize) {
      if (worker) return;

      try {
        worker = createWorker(zstSize);
        workerStarted = true;

        worker.onmessage = e => {
          const d = e.data;

          switch (d.type) {
            case 'progress':
              app.updateProgress(d);
              break;

            case 'status':
              app.status = d.text;
              break;

            case 'wasmReady':
              app.onWasmReady(d.wasmUrl);
              break;

            case 'error':
              app.onError(d.error);
              break;
          }
        };

        worker.onerror = e => {
          e.preventDefault();
          app.onError(e.message || 'Worker 执行异常');
        };

        worker.onmessageerror = () => {
          app.onError('Worker 消息解析失败');
        };

        worker.postMessage({ type: 'start' });

      } catch (err) {
        app.onError(err.message || '无法创建 Worker');
      }
    }


    let started = false;


    async function boot() {
      if (started) return;
      started = true;

      try {
        if (!supportsJSPI()) {
          throw new Error('当前浏览器不支持 JSPI');
        }

        if (!isWasm64Supported()) {
          throw new Error('当前浏览器不支持 Memory64');
        }

        await waitForSWController();

        if (!ensureCOIReady()) {
          return;
        }

        const zstSize = Number(window.app.zstSize);

        if (!Number.isSafeInteger(zstSize) || zstSize <= 0) {
          throw new Error('无效的压缩包大小');
        }

        startLoading(zstSize);

      } catch (err) {
        console.error(err);
        app.onError(err);
      }
    }


    

    async function startQtApplication(wasmUrl) {
      window.wasmUrl = wasmUrl;

      try {
        await qtLoad({
          qt: {
            onLoaded: () => {
              app.onAppReady();
            },

            onExit: () => {
              setTimeout(() => location.reload(), 2500);
            },

            entryFunction: window.blog_entry,

            containerElements: [
              document.getElementById('qt-container')
            ]
          }
        });
      } catch (err) {
        app.onError(err);
      }
    }
  </script>
